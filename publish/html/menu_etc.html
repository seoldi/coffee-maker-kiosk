<!DOCTYPE html>
<html>
<!--<div data-include-path="header.html"></div>-->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="theme-color" content="#00ADEF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Coffee Maker Kiosk</title>

    <link href="../css/reset.css" rel="stylesheet">
    <link href="../fonts/Pretendard/fonts.css" rel="stylesheet">
    <link href="../fonts/Montserrat/fonts.css" rel="stylesheet">
    <link href="../../js/plugin/jquery.modal.min.css" rel="stylesheet">
    <link href="../css/style.css?aft" rel="stylesheet">

    <script src="../../js/jquery-3.7.0.min.js"></script>

    <!-- jQuery Modal -->
    <script src="../../js/plugin/jquery.modal.min.js"></script>
    <script src="../../js/script.js"></script>
</head>

    <body id="menu" class="wrap">
        <header>
            <div class="inner">
                <a href="index.html"><img src="../source/logo.svg" class="logo"></a>
                <a href="index.html"><img src="../source/ico_home.svg"></a>
            </div>
            <nav>
                <a href="menu_coffee.html" class="item">커피메뉴</a>
                <a href="menu_etc.html" class="item active">기타음료</a>
                <a href="menu_side.html" class="item">사이드메뉴</a>
            </nav>
        </header>
        <section id="board">
            <div class="list">
                <a href="#" class="item">
                    <img src="../source/etc_1.png">
                    <h3>콜라</h3>
                    <div class="price">
                        <p>1,000</p>
                        <img src="../source/menu_add.svg">
                    </div>
                </a>
                <a href="#" class="item">
                    <img src="../source/etc_2.png">
                    <h3>사이다</h3>
                    <div class="price">
                        <p>1,000</p>
                        <img src="../source/menu_add.svg">
                    </div>
                </a>
                <a href="#" class="item">
                    <img src="../source/etc_3.png">
                    <h3>오렌지주스</h3>
                    <div class="price">
                        <p>1,500</p>
                        <img src="../source/menu_add.svg">
                    </div>
                </a>
                <a href="#" class="item">
                    <img src="../source/etc_4.png">
                    <h3>토마토주스</h3>
                    <div class="price">
                        <p>1,500</p>
                        <img src="../source/menu_add.svg">
                    </div>
                </a>
            </div>
            <div class="navigation">
                <p class="bt prev"></p>
                <ol class="dot">
                    <li class="active"></li>
                    <li></li>
                </ol>
                <p class="bt next active"></p>
            </div>
        </section>
        <section id="orderList">
            <div class="list">
                <div class="item">
                    <div class="left">
                        <p class="num">1</p>
                        <p class="name">아이스아메리카노</p>
                        <img src="../source/price_addShot.svg" alt="샷추가">
                    </div>
                    <div class="right">
                        <div class="count">
                            <img src="../source/price_minus.svg">
                            <span>1</span>
                            <img src="../source/price_plus.svg">
                        </div>
                        <p class="price">3,000</p>
                        <img src="../source/price_remove.svg" alt="Remove">
                    </div>
                </div>
                
                <div class="item">
                    <div class="left">
                        <p class="num">2</p>
                        <p class="name">아메리카노</p>
                        <!-- <img src="../source/price_addShot.svg" alt="샷추가"> -->
                    </div>
                    <div class="right">
                        <div class="count">
                            <img src="../source/price_minus.svg">
                            <span>1</span>
                            <img src="../source/price_plus.svg">
                        </div>
                        <p class="price">3,000</p>
                        <img src="../source/price_remove.svg" alt="Remove">
                    </div>
                </div>
                
                <div class="item">
                    <div class="left">
                        <p class="num">3</p>
                        <p class="name">에스프레소</p>
                        <!-- <img src="../source/price_addShot.svg" alt="샷추가"> -->
                    </div>
                    <div class="right">
                        <div class="count">
                            <img src="../source/price_minus.svg">
                            <span>1</span>
                            <img src="../source/price_plus.svg">
                        </div>
                        <p class="price">2,500</p>
                        <img src="../source/price_remove.svg" alt="Remove">
                    </div>
                </div>
                
                <div class="item">
                    <div class="left">
                        <p class="num">4</p>
                        <p class="name">카푸치노</p>
                        <img src="../source/price_addShot.svg" alt="샷추가">
                    </div>
                    <div class="right">
                        <div class="count">
                            <img src="../source/price_minus.svg">
                            <span>1</span>
                            <img src="../source/price_plus.svg">
                        </div>
                        <p class="price">3,500</p>
                        <img src="../source/price_remove.svg" alt="Remove">
                    </div>
                </div>
            </div><!--End .list-->

            <!-- Start 2023-09-07 버튼형식 변경으로 인한 구조변경 -->
            <div class="buttons">
                <div class="bt up active">
                    <img src="../source/list_up.svg">
                </div>
                <div class="scroll">
                    <span class="bar"></span>
                </div>
                <div class="bt down">
                    <img src="../source/list_down.svg">
                </div>
            </div>
            <!-- End 2023-09-07 버튼형식 변경으로 인한 구조변경 -->
        </section>

        <section id="total">
            <div class="left">
                <p>주문수량 : <b>4</b></p>
                <p>주문금액 : <b class="price">6,500</b></p>
            </div>
            <div class="right btn_wrap">
                <a href="index.html" class="btn btn-secondary">주문취소</a>
                <a href="#modalPoint" rel="modal:open" class="btn btn-red"><img src="../source/ico_order.svg">주문하기</a>
            </div>
        </section>

        <!-- Modal : 커피메뉴 샷추가 -->
        <div id="orderShot" class="modal">
            <img src="../source/shot_cup.svg">
            <div class="text">
                <h3>샷 추가</h3>
                <p>커피메뉴는 샷추가가 가능합니다.</p>
                <span>500</span>
            </div>
            <div class="btn_wrap">
                <a href="" class="btn btn-secondary">취소</a>
                <a href="" class="btn btn-primary">추가하기</a>
            </div>
        </div>

        <!-- Modal : 포인트 -->
        <div id="modalPoint" class="modal">
            <div class="inner">
                <h2>포인트를 사용하시겠습니까?</h2>
                <div class="input_wrap">
                    <div class="point">
                        <p>잔여포인트</p>
                        <input class="input" type="nember" value="25,000" readonly="">
                        <p>P</p>
                    </div>
                    <div class="explain red">전체사용</div>
                </div>

                <div class="input_wrap">
                    <div class="point">
                        <p>사용포인트</p>
                        <input class="input" type="nember" value="0" readonly="">
                        <p>P</p>
                    </div>
                    <div class="explain">최소 사용 포인트는 <b>1,000p</b>입니다.</div>
                </div>

                <div class="keypad">
                    <button type="button" class="key" data-key="1">1</button>
                    <button type="button" class="key" data-key="2">2</button>
                    <button type="button" class="key" data-key="3">3</button>
                    <button type="button" class="key" data-key="4">4</button>
                    <button type="button" class="key" data-key="5">5</button>
                    <button type="button" class="key" data-key="6">6</button>
                    <button type="button" class="key" data-key="7">7</button>
                    <button type="button" class="key" data-key="8">8</button>
                    <button type="button" class="key" data-key="9">9</button>
                    <button type="button" class="key-clear">C</button>
                    <button type="button" class="key" data-key="0">0</button>
                    <button type="button" class="key-del"><img src="../source/key-del.svg"></button>
                </div>
                <div class="btn_wrap">
                    <a href="#" rel="modal:close" class="btn btn-secondary">포인트 사용안함</a>
                    <a href="orderList.html" class="btn btn-primary">확인</a>
                </div>

            </div>
        </div>
    </body>
    
    <script src="../common/js/script.js"></script>
    <script src="../common/js/jquery-3.7.0.min.js"></script>

    <!-- jQuery Modal -->
    <script src="../common/plugin/jquery-modal/jquery.modal.min.js"></script>
    
</html>
