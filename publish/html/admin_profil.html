<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="theme-color" content="#00ADEF">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Coffee Maker Kiosk</title>

    <link href="../css/reset.css" rel="stylesheet">
    <link href="../fonts/Pretendard/fonts_admin.css" rel="stylesheet">
    <link href="../fonts/Montserrat/fonts_admin.css" rel="stylesheet">
    <link href="../../js/plugin/jquery.modal.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/admin.css" rel="stylesheet">

    <script src="../../js/jquery-3.7.0.min.js"></script>

    <!-- jQuery Modal -->
    <script src="../../js/plugin/jquery.modal.min.js"></script>
    <script src="../../js/script.js"></script>
</head>

<body>
    <script>document.querySelector('link[href="../css/style.css"]').remove();</script>
    <div class="sub">
        <header>
            <a href="admin_intro.html" class="home"><img src="../source/top_home.svg"></a>
            <h2>사용자 정보</h2>
            <div class="right">
                <a href="admin_profil.html"><img src="../source/top_user.svg"></a>
                <a href="admin_intro.html"><img src="../source/top_logout.svg"></a>
            </div>
        </header>
        <main class="profil">
            <h3>관리자 정보</h3>
            <section>
                <div class="item">
                    <h4>현재 ID</h4>
                    <p class="currentId">ROOT</p>
                </div>
                <div class="item">
                    <h4>변경 ID</h4>
                    <input class="input" type="text" readonly>
                </div>
                <div class="item">
                    <h4>새 비밀번호</h4>
                    <input class="input" type="password" placeholder="******" readonly>
                </div>
                <div class="item">
                    <h4>변경 비밀번호</h4>
                    <input class="input" type="password" placeholder="******" readonly>
                    <p class="explain">E메일 주소를 입력하여 주십시오</p>
                </div>
            </section>

            <div class="line"></div>

            <section>
                <div class="item">
                    <h4>가게명</h4>
                    <input class="input" type="text" placeholder="커피메이커" readonly>
                </div>
                <div class="item">
                    <h4>가맹번호</h4>
                    <input class="input" type="text" placeholder="23101548" readonly>
                </div>
                <div class="item">
                    <h4>E-MAIL</h4>
                    <input class="input" type="text" placeholder="coffee@gmail.com" readonly>
                </div>
                <div class="item">
                    <h4>휴대폰번호</h4>
                    <input class="input" type="text" placeholder="01012345679" readonly>
                    <p class="explain red">비밀번호를 다시확인하여 주십시오</p>
                </div>
                <!-- 2023-11-06 긴인풋 추가 -->
                <div class="item">
                    <h4>가게주소</h4>
                    <input class="input width" type="text" placeholder="" readonly>
                </div>
                <div class="item">
                    <h4>pushover 개정</h4>
                    <input class="input" type="text" placeholder="" readonly>
                    <p class="explain red">핸드폰 알람</p>
                </div>
            </section>
            
            <div class="line"></div>

            <div class="bt">정보수정</div>
        </main>
        <nav>
            <a href="admin_coffee.html" class="item active">
                <img src="../source/nav_coffee.svg">
                <p>커피메뉴</p>
            </a>
            <a href="admin_side.html" class="item">
                <img src="../source/nav_side.svg">
                <p>사이드메뉴</p>
            </a>
            <a href="#addMenu" rel="modal:open" class="item">
                <img src="../source/nav_plus.svg">
            </a>
            <a href="admin_etc.html" class="item">
                <img src="../source/nav_etc.svg">
                <p>기타메뉴</p>
            </a>
            <a href="admin_setting.html" class="item">
                <img src="../source/nav_setting.svg">
                <p>기계설정</p>
            </a>
        </nav>
    </div>

    <!-- Modal : 새메뉴 추가 팝업 -->
    <div id="addMenu" class="modal">
        <div class="inner">
            <h2>NEW MENU</h2>

            <section>
                <div class="upload">
                    <img src="../source/upload.svg">
                    <a href="#" class="bt">Image Upload</a>
                </div>
                <div class="item">
                    <h3>제품명</h3>
                    <input class="input" type="text">
                </div>
                <div class="item">
                    <h3>가격</h3>
                    <input class="input" type="text">
                    <p>원</p>
                </div>
                <div class="item">
                    <h3>포인트</h3>
                    <input class="input" type="text">
                    <p>P</p>
                </div>
                <div class="item">
                    <h3>샷유무</h3>
                    <div class="shot">
                        <a href="" class="active">가능</a>
                        <a href="" class="deactive">불가능</a>
                    </div>
                </div>
                <div class="item">
                    <h3>재고</h3>
                    <input class="input" type="text" placeholder="45">
                    <p>EA</p>
                </div>
                <div class="hidden">
                    <input type="checkbox" id="chk" class="styled-checkbox">
                    <label for="chk">메뉴 화면에서 숨기기</label>
                </div>
            </section>

            <a href="" class="bt addBt">추가하기</a>
        </div>
    </div>
</body>
</html>
