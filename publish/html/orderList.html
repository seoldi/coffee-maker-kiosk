<head>

    <body id="pay" class="wrap">
        <h2><span class="point">주문리스트</span>를 확인해주세요.</h2>
        <section class="list">
            <div class="item">
                <img src="../source/coffee_1.png" class="img">
                <h3>아이스아메리카노</h3>
                <p class="price">3,000</p>
                <div class="count">
                    <img src="../source/price_minus.svg">
                    <span>1</span>
                    <img src="../source/price_plus.svg">
                </div>
                <img src="../source/price_remove.svg" class="remove">
            </div>
            <div class="item">
                <img src="../source/coffee_2.png" class="img">
                <h3>아메리카노</h3>
                <p class="price">3,000</p>
                <div class="count">
                    <img src="../source/price_minus.svg">
                    <span>1</span>
                    <img src="../source/price_plus.svg">
                </div>
                <img src="../source/price_remove.svg" class="remove">
            </div>
            <div class="item">
                <img src="../source/side_1.png" class="img">
                <h3>마카롱</h3>
                <p class="price">1,000</p>
                <div class="count">
                    <img src="../source/price_minus.svg">
                    <span>1</span>
                    <img src="../source/price_plus.svg">
                </div>
                <img src="../source/price_remove.svg" class="remove">
            </div>
        </section>

        <section id="totalPrice">
            <div class="item total">
                <p class="tl">주문금액</p>
                <p class="num">7,000</p>
            </div>
            <div class="item point">
                <p class="tl">포인트사용</p>
                <p class="num">-1,000(잔여 8,000P)</p>
            </div>
            <div class="buttons">
                <a href="menu_coffee.html" class="cancel">취소</a>
                <a href="cardPay.html" class="payBtn">
                    6,000<p>결제하기</p>
                </a>
            </div>
        </section>
    </body>
    
    <script src="../common/js/script.js"></script>
