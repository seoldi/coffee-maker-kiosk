<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffee Maker Kiosk</title>
<style>
  :root{ --bg:#f5ede1; --brown:#3d2b23; --accent:#a9714a; --cream:#fff8ef; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Pretendard","Malgun Gothic",sans-serif;background:var(--bg);color:var(--brown);
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .card{max-width:520px;width:100%;background:var(--cream);border-radius:20px;padding:40px 36px;
        box-shadow:0 12px 40px rgba(61,43,35,.15);}
  h1{margin:0 0 6px;font-size:1.6rem;letter-spacing:.02em;}
  .sub{margin:0 0 24px;color:#8a7263;font-size:.95rem;line-height:1.5;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
  .tag{background:#efe1d1;color:var(--accent);font-size:.78rem;padding:5px 12px;border-radius:999px;font-weight:600;}
  .links{display:flex;flex-direction:column;gap:12px;}
  a.btn{display:block;text-align:center;padding:16px;border-radius:12px;text-decoration:none;font-weight:700;
        transition:transform .15s ease;}
  a.btn:hover{transform:translateY(-2px);}
  .primary{background:var(--brown);color:#fff;}
  .secondary{background:#e8dccb;color:var(--brown);}
  footer{margin-top:24px;font-size:.78rem;color:#a8927f;text-align:center;}
  footer a{color:var(--accent);}
</style>
</head>
<body>
  <div class="card">
    <h1>☕ Coffee Maker Kiosk</h1>
    <p class="sub">무인 커피 키오스크 주문/결제/관리자 UI 프로토타입입니다.<br>반응형 HTML5·CSS·JavaScript로 퍼블리싱했습니다.</p>
    <div class="tags">
      <span class="tag">HTML5</span>
      <span class="tag">CSS3</span>
      <span class="tag">JavaScript</span>
      <span class="tag">Responsive</span>
      <span class="tag">jQuery</span>
    </div>
    <div class="links">
      <a class="btn primary" href="demo.html" target="_blank" rel="noopener">🛒 주문 화면 시작하기</a>
      <a class="btn secondary" href="demo.html?src=admin_intro" target="_blank" rel="noopener">⚙️ 관리자 모드 보기</a>
    </div>
    <footer>Design &amp; Front-end by <a href="https://github.com/seoldi">seoldi</a></footer>
  </div>
</body>
</html>
